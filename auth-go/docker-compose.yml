version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/authdb?sslmode=disable
      JWT_SIGNING_KEY: "yeehaw"
      ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    entrypoint: ["/wait-for-postgres.sh", "postgres", "/auth-go"]

volumes:
  pgdata:
