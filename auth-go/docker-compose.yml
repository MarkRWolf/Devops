services:
  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
      DATABASE_URL: postgres://postgres:postgres@auth-db:5432/authdb?sslmode=disable
      JWT_SIGNING_KEY: "dev-sign-key-change-me"
      ADDR: ":8080"
    command: ["/wait-for-postgres.sh", "auth-db", "/auth-go"]
    ports:
      - "8080:8080"
    volumes:
      - ./migrations:/app/migrations:ro

  kratos-db:
    image: postgres:15
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kratos
    ports:
      - "5433:5432"
    volumes:
      - kratos-db-data:/var/lib/postgresql/data

  kratos-migrate:
    image: oryd/kratos:v25.4.0
    depends_on:
      - kratos-db
    environment:
      DSN: postgres://kratos:secret@kratos-db:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    volumes:
      - ./kratos/kratos.yml:/etc/kratos/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/kratos/identity.schema.json:ro

  kratos:
    image: oryd/kratos:v25.4.0
    depends_on:
      kratos-db:
        condition: service_started
      kratos-migrate:
        condition: service_completed_successfully
    command: serve --dev --config /etc/kratos/kratos.yml
    environment:
      LOG_LEVEL: debug
      DSN: postgres://kratos:secret@kratos-db:5432/kratos?sslmode=disable
    ports:
      - "4433:4433"
      - "4434:4434"
    volumes:
      - ./kratos/kratos.yml:/etc/kratos/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/kratos/identity.schema.json:ro

  hydra-db:
    image: postgres:15
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: hydra
    ports:
      - "5434:5432"
    volumes:
      - hydra-db-data:/var/lib/postgresql/data

  hydra-migrate:
    image: oryd/hydra:v25.4.0
    depends_on:
      - hydra-db
    environment:
      DSN: postgres://hydra:secret@hydra-db:5432/hydra?sslmode=disable
    command: migrate sql --yes

  hydra:
    image: oryd/hydra:v25.4.0
    depends_on:
      hydra-db:
        condition: service_started
      hydra-migrate:
        condition: service_completed_successfully
    command: serve all --dev
    environment:
      DSN: postgres://hydra:secret@hydra-db:5432/hydra?sslmode=disable
      LOG_LEVEL: debug
      SYSTEM_SECRET: this-should-be-long-and-random
      OAUTH2_ISSUER_URL: http://localhost:4444/
    ports:
      - "4444:4444"
      - "4445:4445"

volumes:
  auth-db-data:
  kratos-db-data:
  hydra-db-data:
