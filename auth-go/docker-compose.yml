version: "3.9"

services:
  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
      DATABASE_URL: postgres://postgres:postgres@auth-db:5432/authdb?sslmode=disable
      JWT_SIGNING_KEY: "dev-sign-key-change-me"
      ADDR: ":8080"
      KRATOS_PUBLIC_URL: http://kratos:4433
      HYDRA_PUBLIC_URL: http://hydra:4444
    command: ["/wait-for-postgres.sh", "auth-db", "/auth-go"]
    ports:
      - "8000:8080"
    volumes:
      - ./migrations:/app/migrations:ro

  kratos-db:
    image: postgres:15
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kratos
    ports:
      - "5433:5432"
    volumes:
      - kratos-db-data:/var/lib/postgresql/data

  kratos-migrate:
    image: oryd/kratos:v25.4.0
    depends_on:
      - kratos-db
    environment:
      DSN: postgres://kratos:secret@kratos-db:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    volumes:
      - ./kratos/kratos.yml:/etc/kratos/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/kratos/identity.schema.json:ro
    restart: "no"

  kratos:
    image: oryd/kratos:v25.4.0
    depends_on:
      - kratos-db
      - kratos-migrate
    command: serve --dev --config /etc/kratos/kratos.yml
    environment:
      LOG_LEVEL: debug
      DSN: postgres://kratos:secret@kratos-db:5432/kratos?sslmode=disable
    ports:
      - "4433:4433"
      - "4434:4434"
    volumes:
      - ./kratos/kratos.yml:/etc/kratos/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/kratos/identity.schema.json:ro

  hydra-db:
    image: postgres:15
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: hydra
    ports:
      - "5434:5432"
    volumes:
      - hydra-db-data:/var/lib/postgresql/data

  hydra-migrate:
    image: oryd/hydra:v25.4.0
    depends_on:
      - hydra-db
    environment:
      DSN: postgres://hydra:secret@hydra-db:5432/hydra?sslmode=disable
    command: migrate sql up --yes
    restart: "no"

  hydra:
    image: oryd/hydra:v25.4.0
    depends_on:
      - hydra-db
      - hydra-migrate
    command: serve all --dev
    environment:
      DSN: postgres://hydra:secret@hydra-db:5432/hydra?sslmode=disable
      LOG_LEVEL: debug

      SECRETS_SYSTEM: |
        [
          "0123456789abcdef0123456789abcdef",
          "abcdef0123456789abcdef0123456789"
        ]

      URLS_LOGIN: http://frontend:3000/login
      URLS_CONSENT: http://frontend:3000/consent

    ports:
      - "4444:4444"
      - "4445:4445"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:4445/health/ready || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  hydra-client:
    image: curlimages/curl:latest
    depends_on:
      - hydra
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until curl -sf http://hydra:4445/health/ready; do sleep 1; done
        sleep 5
        curl --fail -X POST http://hydra:4445/clients \
          -H "Content-Type: application/json" \
          -d '{
            "client_id": "auth-client",
            "client_secret": "auth-secret",
            "grant_types": ["authorization_code","refresh_token"],
            "response_types": ["code","id_token"],
            "scope": "openid profile offline",
            "callbacks": ["http://frontend:3000/auth/callback"],
            "token_endpoint_auth_method": "client_secret_post",
            "skip_consent": true
          }'

volumes:
  auth-db-data:
  kratos-db-data:
  hydra-db-data:

