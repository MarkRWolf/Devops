version: "3.7"

networks:
  intranet:

volumes:
  mssql-data:
  devops_data_protection_keys:
  hydra-sqlite:
  kratos-sqlite:

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: Y
    ports: ["1433:1433"]
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - intranet

  initdb:
    image: mcr.microsoft.com/mssql-tools
    depends_on: [sqlserver]
    entrypoint: >
      /bin/bash -c "
      until /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P ${SA_PASSWORD} -Q 'SELECT 1'; do sleep 5; done &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P ${SA_PASSWORD} -Q \"IF DB_ID('DevopsDB') IS NULL CREATE DATABASE DevopsDB;\"
      "
    networks:
      - intranet

  server:
    build:
      context: .
      dockerfile: Devops/Dockerfile
      target: runtime
    depends_on:
      initdb:
        condition: service_completed_successfully
    environment:
      UseSqliteForTests: true
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DevopsDB: Data Source=/app/devops.db
      JwtSettings__Secret: ${JWT_SETTINGS_SECRET}
      JwtSettings__Issuer: http://localhost
      JwtSettings__Audience: http://localhost
      GitHub__ProjectPat: ${GITHUB_PROJECT_PAT}
      GitHub__ProjectOwnerRepo: "MarkRWolf/Devops"
      GitHub__WebhookSecret: ${GITHUB_REPO_WEBHOOK_SECRET}
      Azure__ProjectOrganization: "igotzeddm"
      Azure__ProjectName: "Devops-Dashboard"
      Azure__ProjectPat: ${AZURE_PROJECT_PAT}
      DP_KEYS_DIR: /app/dpkeys
    ports: ["8080:5205"]
    volumes:
      - devops_data_protection_keys:/app/dpkeys
    networks:
      - intranet

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_SELF_URL: ${NEXT_PUBLIC_SELF_URL}
    depends_on: [server]
    environment:
      DOTNET_API_BASE_URL: http://server:5205/API
      NEXT_PUBLIC_SELF_URL: ${NEXT_PUBLIC_SELF_URL}
      ORY_HYDRA_CLIENT_ID: dev-nextauth
      ORY_HYDRA_CLIENT_SECRET: client-secret-secure
      ORY_HYDRA_ISSUER: http://localhost/hydra
      NEXTAUTH_URL: http://localhost
      NEXTAUTH_SECRET: 42d44937ddea48d86fc9c08f5b452652b1fee73056208bb06c5d11dea04cf50d
    ports: ["3001:3000"]
    networks:
      - intranet

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [server, client, hydra]
    ports: ["80:80"]
    networks:
      - intranet

  hydra:
    image: oryd/hydra:v2.2.0
    ports:
      - "4444:4444"
      - "4445:4445"
      - "5555:5555"
    volumes:
      - hydra-sqlite:/var/lib/sqlite
      - ./auth/config:/etc/config/hydra
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    depends_on:
      - hydra-migrate
    networks:
      - intranet

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true
    command: migrate -c /etc/config/hydra/hydra.yml sql -e --yes
    volumes:
      - hydra-sqlite:/var/lib/sqlite
      - ./auth/config:/etc/config/hydra
    restart: on-failure
    networks:
      - intranet

  kratos-migrate:
    image: oryd/kratos:v1.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true
    volumes:
      - kratos-sqlite:/var/lib/sqlite
      - ./auth/config:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure
    networks:
      - intranet

  kratos:
    image: oryd/kratos:v1.2.0
    depends_on: [kratos-migrate]
    ports:
      - "4433:4433"
      - "4434:4434"
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - kratos-sqlite:/var/lib/sqlite
      - ./auth/config:/etc/config/kratos
    restart: unless-stopped
    networks:
      - intranet

  kratos-selfservice-ui-node:
    image: oryd/kratos-selfservice-ui-node:v1.1.0
    depends_on: [kratos]
    ports:
      - "4455:4455"
    environment:
      - KRATOS_PUBLIC_URL=http://kratos:4433/
      - KRATOS_BROWSER_URL=http://localhost:4433
      - HYDRA_ADMIN_URL=http://hydra:4445
      - PORT=4455
      - COOKIE_SECRET=SuperSecretCookie
      - CSRF_COOKIE_NAME=__OryKratosApp
      - CSRF_COOKIE_SECRET=SuperSecretCookieCsrf
      - DANGEROUSLY_DISABLE_SECURE_CSRF_COOKIES=true
    networks:
      - intranet
    restart: on-failure

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436"
      - "4437:4437"
    networks:
      - intranet
