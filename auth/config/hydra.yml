serve:
  cookies:
    same_site_mode: Lax
  public:
    cors:
      enabled: true
      allowed_origins:
        - https://devoptics.mark-wolf.com
        - http://127.0.0.1*
        - http://localhost*
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
      exposed_headers:
        - Content-Type
  admin:
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1*
        - http://localhost*
      allowed_methods:
        - GET
        - POST
        - OPTIONS
      allowed_headers:
        - Content-Type
      exposed_headers:
        - Content-Type

# 4444: Hydra public URL
# 4455: Kratos UI: Kratos sign up, sign in, logout
# 4434: Kratos admin URL
urls:
  self:
    issuer: http://hydra:4444/
    public: http://localhost/hydra
  consent: http://localhost:4455/consent
  login: http://localhost:4455/login
  logout: http://localhost:4455/logout
  identity_provider:
    url: http://kratos:4434

secrets:
  system:
    - CHANGE_ME_TO_REAL_SECRET

oidc:
  subject_identifiers:
    supported_types:
      - pairwise
      - public
    pairwise:
      salt: CHANGE_ME_TO_REAL_SECRET

log:
  leak_sensitive_values: true
  level: info

